{% extends 'base.html' %}
{% block content %}
<h1 class="title">{{ 'Editar' if juego else 'Nuevo' }} videojuego</h1>
<form method="post">
  <div class="field"><label class="label">Nombre</label>
    <input class="input" name="nombre" required value="{{ juego.nombre if juego else '' }}"></div>
  <div class="field"><label class="label">Descripción</label>
    <input class="input" name="descripcion" required value="{{ juego.descripcion if juego else '' }}"></div>
  <div class="field"><label class="label">Precio</label>
    <input class="input" name="precio" type="number" step="0.01" min="0" required value="{{ juego.precio if juego else '' }}"></div>
  <button class="button is-primary">Guardar</button>
  <a class="button" href="{{ url_for('index') }}">Cancelar</a>
</form>
{% endblock %}
