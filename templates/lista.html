{% extends 'base.html' %}
{% block content %}
<h1 class="title">Videojuegos</h1>
<a class="button is-primary mb-4" href="{{ url_for('nuevo') }}">Nuevo juego</a>
<table class="table is-fullwidth is-striped">
  <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Acciones</th></tr></thead>
  <tbody>
  {% for juego in juegos %}
    <tr>
      <td>{{ juego.id }}</td>
      <td>{{ juego.nombre }}</td>
      <td>{{ juego.descripcion }}</td>
      <td>${{ juego.precio }}</td>
      <td>
        <a class="button is-small is-info" href="{{ url_for('editar', id=juego.id) }}">Editar</a>
        <form method="post" action="{{ url_for('eliminar', id=juego.id) }}" style="display:inline">
          <button class="button is-small is-danger">Eliminar</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="5">No hay juegos registrados.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
